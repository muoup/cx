name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          source /etc/os-release
          echo "deb https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22 llvm-22-dev
          llvm_prefix=/usr/lib/llvm-22
          echo "LLVM_SYS_221_PREFIX=${llvm_prefix}" >> "$GITHUB_ENV"
          echo "${llvm_prefix}/bin" >> "$GITHUB_PATH"
          "${llvm_prefix}/bin/llvm-config" --version

      - name: Run Cranelift and LLVM integration tests
        run: cargo test -p integration-tests --features backend-llvm -- --test-threads=1

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          source /etc/os-release
          echo "deb https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22 llvm-22-dev
          llvm_prefix=/usr/lib/llvm-22
          echo "LLVM_SYS_221_PREFIX=${llvm_prefix}" >> "$GITHUB_ENV"
          echo "${llvm_prefix}/bin" >> "$GITHUB_PATH"
          "${llvm_prefix}/bin/llvm-config" --version

      - name: Run compiler benchmarks
        run: |
          set -o pipefail
          cargo run -p cx-benchmarks --features backend-llvm -- --iterations 1 --warmups 0 --backend both --format github | tee -a "$GITHUB_STEP_SUMMARY"
