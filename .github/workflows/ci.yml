name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo test -p integration-tests -q

  llvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.8"
          directory: llvm

      - run: echo "LLVM_SYS_221_PREFIX=${LLVM_PATH}" >> "$GITHUB_ENV"

      - run: cargo test -p integration-tests --features backend-llvm -q

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.8"
          directory: llvm

      - run: echo "LLVM_SYS_221_PREFIX=${LLVM_PATH}" >> "$GITHUB_ENV"

      - name: Run compiler benchmarks
        run: |
          set -o pipefail
          cargo run -p cx-benchmarks --features backend-llvm -- --iterations 1 --warmups 0 --backend both --format github | tee -a "$GITHUB_STEP_SUMMARY"
