[workspace]
resolver = "2"

members = [
    "compiler/cx",
    "compiler/cx-lsp", "compiler/cx-mir",
    "compiler/cx-zed-extension",
    "tests"
]

# Keep feature-gated path dependencies out of the workspace's default package set.
# They are still built when a workspace member enables the corresponding feature.
exclude = [
    "compiler/cx-backend-llvm"
]

[profile.release-with-debug]
inherits = "release"
debug = true
