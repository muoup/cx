[workspace]
resolver = "2"

members = [
    "compiler/cx", "compiler/cx-hmir", "compiler/cx-intrinsics",
    "compiler/cx-lsp",
    "compiler/cx-zed-extension",
    "tests/benchmarks",
    "tests/integration",
    "tests/support"
]

# Keep feature-gated path dependencies out of the workspace's default package set.
# They are still built when a workspace member enables the corresponding feature.
exclude = [
    "compiler/cx-backend-llvm",
]

[workspace.dependencies]
index_vec = "0.1.4"
rustc-hash = "2.1.3"

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.test]
opt-level = 1
