[package]
name = "chl-benchmarks"
version = "0.0.0"
edition = "2021"

[features]
default = ["chl-test-support/default"]
backend-llvm = ["chl-test-support/backend-llvm"]

[dependencies]
chl-test-support = { path = "../support", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.21", default-features = false, features = ["derive"] }
