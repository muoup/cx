[package]
name = "integration-tests"
version = "0.0.0"
edition = "2021"
build = "build.rs"

[features]
default = ["cx-pipeline-data/test", "system-headers"]
system-headers = ["cx-pipeline/system-headers"]
backend-llvm = ["cx-pipeline/backend-llvm"]

[[test]]
name = "suite"
path = "test.rs"
harness = true

[dependencies]
cx-pipeline-data = { path = "../compiler/cx-pipeline-data" }
cx-pipeline = { path = "../compiler/cx-pipeline", default-features = false }
