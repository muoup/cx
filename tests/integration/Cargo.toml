[package]
name = "integration-tests"
version = "0.0.0"
edition = "2021"
build = "build.rs"

[features]
default = ["chl-test-support/default"]
ignoresystem-headers = ["chl-test-support/ignore-system-headers"]
backend-llvm = ["chl-test-support/backend-llvm"]

[[test]]
name = "suite"
path = "test.rs"
harness = true

[dependencies]
chl-test-support = { path = "../support", default-features = false }
chl-pipeline = { path = "../../compiler/chl-pipeline", default-features = false }
chl-pipeline-data = { path = "../../compiler/chl-pipeline-data" }
