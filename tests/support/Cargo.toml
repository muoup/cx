[package]
name = "chl-test-support"
version = "0.0.0"
edition = "2021"

[features]
default = ["chl-pipeline-data/test"]
ignore-system-headers = ["chl-pipeline/ignore-system-headers"]
backend-llvm = ["chl-pipeline/backend-llvm"]

[dependencies]
chl-pipeline-data = { path = "../../compiler/chl-pipeline-data", default-features = false }
chl-pipeline = { path = "../../compiler/chl-pipeline", default-features = false }
chl-log = { path = "../../compiler/chl-log" }
rustc-hash = { workspace = true }
serde = { version = "1", features = ["derive"] }
